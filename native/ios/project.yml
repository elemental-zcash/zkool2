name: ZkoolPOC
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  QRCodeGenerator:
    url: https://github.com/dagronf/swift-qrcode-generator.git
    revision: 61fe7fc530cafc90a8cd6291e968520d9f7ad687
targets:
  ZkoolPOC:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Generated/ZkoolNative.swift
    info:
      path: Info.plist
      properties:
        UIAppFonts:
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Bold.ttf
        NSCameraUsageDescription: Scan a recipient address to send Zcash.
    dependencies:
      - package: QRCodeGenerator
        product: QRCodeGenerator
      - framework: Frameworks/ZkoolNativeFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
      - sdk: libiconv.tbd
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zkool.poc
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zkool
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  ZkoolPOC:
    build:
      targets:
        ZkoolPOC: all
    run:
      config: Debug
