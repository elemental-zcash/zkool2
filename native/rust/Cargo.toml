[package]
name = "zkool-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "zkool_native"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "zkool-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
bundled-sapling-params = ["rlz/bundled-sapling-params"]

[dependencies]
anyhow = "1"
rlz = { path = "../../rust", default-features = false, features = ["graphql-core"] }
uniffi = { version = "=0.31.0", features = ["tokio"] }
juniper = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
